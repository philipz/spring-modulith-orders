# 訂單生命週期模型的驗證清單（agent-write-spec 模型階段，ADR-018 §7）。
#
# 只宣告「要跑什麼」——預期結果一律由 CI 重新執行後判定，本檔不得宣告結果。
# 每個實例常數都附 domain_justification（Q21）。
#
# ORDER_IDS 為符號化的訂單編號集合。程式以 UUID 產生訂單編號、不限制訂單筆數：
#   - OrderService.java:35-37：orderNumber 為空時以 UUID.randomUUID() 產生
#   - OrderMapper.java:16：建立 entity 時指派 UUID
#   - OrderRepository.java：只有 findByOrderNumber 等查詢，無數量上限或檢查
# 因此取最小邊界 1，以及偶數 2、奇數 3，涵蓋邊界與奇偶。

instances:
  - module: oneOrder
    constants:
      ORDER_IDS:
        value: 'Set("o1")'
        domain_justification: "程式未限制訂單筆數（OrderService.java:35-37 以 UUID 產生編號、OrderMapper.java:16、OrderRepository.java 無數量檢查）；取最小邊界 1。"
  - module: twoOrders
    constants:
      ORDER_IDS:
        value: 'Set("o1", "o2")'
        domain_justification: "程式未限制訂單筆數（OrderService.java:35-37 以 UUID 產生編號、OrderMapper.java:16、OrderRepository.java 無數量檢查）；取偶數 2 涵蓋多鍵交錯。"
  - module: threeOrders
    constants:
      ORDER_IDS:
        value: 'Set("o1", "o2", "o3")'
        domain_justification: "程式未限制訂單筆數（OrderService.java:35-37 以 UUID 產生編號、OrderMapper.java:16、OrderRepository.java 無數量檢查）；取奇數 3 涵蓋邊界與奇偶。"
checks:
  # INV_newOrderStartsNew（R1）：建立時的寫入必須為 NEW。
  - { instance: oneOrder, invariant: INV_newOrderStartsNew, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_orderCreatedAsNew] }
  - { instance: twoOrders, invariant: INV_newOrderStartsNew, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_orderCreatedAsNew] }
  - { instance: threeOrders, invariant: INV_newOrderStartsNew, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_orderCreatedAsNew] }

  # INV_normalFlowIsSingleStep（R2）：正常流程必須逐階前進。
  - { instance: oneOrder, invariant: INV_normalFlowIsSingleStep, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_normalForwardStep] }
  - { instance: twoOrders, invariant: INV_normalFlowIsSingleStep, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_normalForwardStep] }
  - { instance: threeOrders, invariant: INV_normalFlowIsSingleStep, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_normalForwardStep] }

  # INV_cancelOnlyFromNewOrPending（R3）：只有 NEW／PENDING 可取消。
  - { instance: oneOrder, invariant: INV_cancelOnlyFromNewOrPending, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_cancelFromAllowed] }
  - { instance: twoOrders, invariant: INV_cancelOnlyFromNewOrPending, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_cancelFromAllowed] }
  - { instance: threeOrders, invariant: INV_cancelOnlyFromNewOrPending, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_cancelFromAllowed] }

  # INV_errorOnlyFromAllowed（R4）：只有允許的來源狀態可轉 ERROR。
  - { instance: oneOrder, invariant: INV_errorOnlyFromAllowed, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_errorFromAllowed] }
  - { instance: twoOrders, invariant: INV_errorOnlyFromAllowed, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_errorFromAllowed] }
  - { instance: threeOrders, invariant: INV_errorOnlyFromAllowed, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_errorFromAllowed] }

  # INV_onlyPermittedTransitions（R5）：R2–R4 以外的轉移一律不允許。
  - { instance: oneOrder, invariant: INV_onlyPermittedTransitions, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_permittedTransition] }
  - { instance: twoOrders, invariant: INV_onlyPermittedTransitions, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_permittedTransition] }
  - { instance: threeOrders, invariant: INV_onlyPermittedTransitions, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_permittedTransition] }

  # INV_committedWritesAreSequentialAndFresh（R6）：不得依過期讀取覆寫。
  - { instance: oneOrder, invariant: INV_committedWritesAreSequentialAndFresh, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_freshSequentialWrite] }
  - { instance: twoOrders, invariant: INV_committedWritesAreSequentialAndFresh, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_freshSequentialWrite] }
  - { instance: threeOrders, invariant: INV_committedWritesAreSequentialAndFresh, mode: run, max_steps: 12, max_samples: 10000, timeout_seconds: 90, witnesses: [WIT_freshSequentialWrite] }
